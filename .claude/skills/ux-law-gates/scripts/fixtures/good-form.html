<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{font:16px system-ui;margin:0;padding:16px}.f{display:grid;gap:4px;margin-bottom:20px}input{height:48px;font:inherit;box-sizing:border-box;width:100%}
.btn{display:block;width:100%;height:52px;background:#0b3d91;color:#fff;border:0;border-radius:12px;font:600 16px system-ui}.btn:active{transform:scale(.98)}</style>
<form>
 <div class="f"><label for="ac">Account number</label><input id="ac" inputmode="numeric" enterkeyhint="next"></div>
 <div class="f"><label for="sc">Sort code</label><input id="sc" inputmode="numeric" enterkeyhint="next"></div>
 <div class="f"><label for="fn">First name</label><input id="fn" autocomplete="given-name" enterkeyhint="next"></div>
 <div class="f"><label for="em">Email</label><input id="em" type="email" autocomplete="email" enterkeyhint="done"></div>
 <p>IBAN on file: AE07 0331 2345 6789 0123 456</p>
 <button class="btn" type="submit">Continue</button>
</form>
